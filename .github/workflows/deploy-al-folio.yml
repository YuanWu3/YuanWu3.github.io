name: Deploy al-folio academic homepage

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout personal homepage repository
        uses: actions/checkout@v4

      - name: Clone al-folio
        run: |
          git clone --depth 1 https://github.com/alshedivat/al-folio.git site

      - name: Overlay Yuan Wu site content
        run: |
          cp al-folio-overlay/_config.yml site/_config_yuan.yml
          rsync -av --exclude '_config.yml' al-folio-overlay/ site/
          mkdir -p site/assets/img
          cp assets/profile.png site/assets/img/profile.png

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
          working-directory: site

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: site/package-lock.json

      - name: Install JavaScript dependencies
        working-directory: site
        run: npm ci

      - name: Build with Jekyll
        working-directory: site
        env:
          JEKYLL_ENV: production
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          pip3 install --upgrade nbconvert
          bundle exec jekyll build --config _config.yml,_config_yuan.yml --trace

      - name: Purge unused CSS
        working-directory: site
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
