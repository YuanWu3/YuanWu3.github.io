name: Deploy al-folio academic homepage

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout personal homepage repository
        uses: actions/checkout@v4

      - name: Clone al-folio
        run: |
          git clone --depth 1 https://github.com/alshedivat/al-folio.git site

      - name: Overlay Yuan Wu site content
        run: |
          rsync -av al-folio-overlay/ site/

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: site

      - name: Build with Jekyll
        working-directory: site
        env:
          JEKYLL_ENV: production
        run: |
          bundle exec jekyll build --trace

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
